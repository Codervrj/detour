[project]
name = "detour"
version = "0.1.0"
description = "Music discovery through listening patterns"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.17",
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "pyarrow>=18.0",
    "implicit>=0.7.2",
    "gensim>=4.3.3",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "zstandard>=0.25.0",
    "scikit-learn>=1.9.1",
    "umap-learn>=0.5.12",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "hypothesis>=6.122",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["detour"]

[tool.uv]
# This machine sits behind a TLS-intercepting proxy. Its root CA is in the Windows
# certificate store but not in uv's bundled bundle, so use the platform store.
native-tls = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
